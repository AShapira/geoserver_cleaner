services:
  geoserver-cleaner:
    image: ghcr.io/ashapira/geoserver-cleaner:${GEOSERVER_CLEANER_TAG:-2.7.0}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      GEOSERVER_URL: ${GEOSERVER_URL}
      GEOSERVER_USER: ${GEOSERVER_USER}
      GEOSERVER_PASSWORD: ${GEOSERVER_PASSWORD}
      GEOSERVER_DATA_DIR: /geoserver_data
      GEOSERVER_EXTERNAL_PATH_MAPPINGS: '${GEOSERVER_EXTERNAL_PATH_MAPPINGS:-{}}'
      GEOSERVER_CATALOG_SOURCE: ${GEOSERVER_CATALOG_SOURCE:-filesystem}
      GEOSERVER_EXCLUDE_WORKSPACES: ${GEOSERVER_EXCLUDE_WORKSPACES:-}
      GEOSERVER_TIMEOUT: ${GEOSERVER_TIMEOUT:-60}
      GEOSERVER_WORKERS: ${GEOSERVER_WORKERS:-8}
      GEOSERVER_INSECURE: ${GEOSERVER_INSECURE:-false}
      APP_DATABASE_PATH: /app_data/geoserver_cleaner.sqlite3
      APP_EXPORT_DIR: /app_exports
      APP_PAGE_SIZE_DEFAULT: ${APP_PAGE_SIZE_DEFAULT:-100}
      APP_PAGE_SIZE_MAX: ${APP_PAGE_SIZE_MAX:-500}
      APP_TITLE: ${APP_TITLE:-GeoServer Cleaner}
      APP_ENABLE_MCP_HTTP: ${APP_ENABLE_MCP_HTTP:-true}
      APP_MCP_HTTP_PATH: ${APP_MCP_HTTP_PATH:-/mcp}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      APP_LOG_PATH: ${APP_LOG_PATH:-/app_data/logs/geoserver_cleaner.log}
      APP_LOG_MAX_BYTES: ${APP_LOG_MAX_BYTES:-10485760}
      APP_LOG_BACKUP_COUNT: ${APP_LOG_BACKUP_COUNT:-5}
      APP_ORPHAN_SMALL_FILE_THRESHOLD_BYTES: ${APP_ORPHAN_SMALL_FILE_THRESHOLD_BYTES:-102400}
    volumes:
      - ${GEOSERVER_DATA_DIR_HOST}:/geoserver_data
      # Example:
      # GEOSERVER_EXTERNAL_PATH_MAPPINGS={"C:\\data\\osm":"/ext_data_path"}
      # GEOSERVER_EXTERNAL_OSM_HOST=/host/path/to/osm
      # - ${GEOSERVER_EXTERNAL_OSM_HOST}:/ext_data_path
      - geoserver-cleaner-app-data:/app_data
      - geoserver-cleaner-exports:/app_exports

volumes:
  geoserver-cleaner-app-data:
  geoserver-cleaner-exports:
