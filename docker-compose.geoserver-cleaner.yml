services:
  geoserver-cleaner:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    ports:
      - "8000:8000"
    environment:
      GEOSERVER_URL: http://host.docker.internal:8081/geoserver
      GEOSERVER_USER: admin
      GEOSERVER_PASSWORD: geoserver
      GEOSERVER_DATA_DIR: /geoserver_data
      GEOSERVER_CATALOG_SOURCE: filesystem
      GEOSERVER_EXCLUDE_WORKSPACES: ""
      APP_DATABASE_PATH: /app_data/geoserver_cleaner.sqlite3
      APP_ENABLE_MCP_HTTP: "true"
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      APP_LOG_PATH: ${APP_LOG_PATH:-/app_data/logs/geoserver_cleaner.log}
      APP_LOG_MAX_BYTES: ${APP_LOG_MAX_BYTES:-10485760}
      APP_LOG_BACKUP_COUNT: ${APP_LOG_BACKUP_COUNT:-5}
    volumes:
      - ./geoserver_test/geoserver_data:/geoserver_data
      - geoserver-cleaner-app-data:/app_data

volumes:
  geoserver-cleaner-app-data:
